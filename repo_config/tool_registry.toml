version = 1
capabilities = [
  "mail.read",
  "mail.search",
  "mail.draft",
  "mail.send",
  "mail.archive",
  "calendar.read",
  "calendar.search",
  "calendar.free_busy",
  "calendar.write",
  "reminder.create",
  "reminder.update",
  "reminder.cancel",
  "content.watch",
  "browser.interact"
]

[[tools]]
id = "google-workspace"
domains = ["mail", "calendar"]
capabilities = [
  "mail.read",
  "mail.search",
  "mail.draft",
  "mail.send",
  "mail.archive",
  "calendar.read",
  "calendar.search",
  "calendar.free_busy",
  "calendar.write"
]
auth = "provider-native"
status = "runtime"
runtime = "openclaw"
command = "gws.ps1"

[[tools]]
id = "himalaya"
domains = ["mail"]
capabilities = [
  "mail.read",
  "mail.search"
]
auth = "local-provider-auth"
status = "runtime"
runtime = "openclaw"
command = "himalaya"
account = "ovgu"
read_only = true

[[tools]]
id = "openclaw-scheduler"
domains = ["reminder"]
capabilities = ["reminder.create", "reminder.update", "reminder.cancel"]
status = "runtime"

[[tools]]
id = "content-poller"
domains = ["content"]
capabilities = ["content.watch"]
status = "runtime"
runtime = "openclaw"
command = "python3 scripts/poll_content_updates.py"
read_only = true

[[tools]]
id = "browser-use"
domains = ["fallback"]
capabilities = ["browser.interact"]
status = "external"

[[accounts]]
id = "personal"
domain = "mail"
tool = "google-workspace"

[[accounts]]
id = "student"
domain = "mail"
tool = "himalaya"
provider_account = "ovgu"

[[accounts]]
id = "google-calendar"
domain = "calendar"
tool = "google-workspace"
