version = 1
capabilities = [
  "mail.read",
  "mail.search",
  "mail.draft",
  "mail.send",
  "mail.archive",
  "calendar.read",
  "calendar.search",
  "calendar.free_busy",
  "calendar.write",
  "reminder.create",
  "reminder.update",
  "reminder.cancel",
  "content.watch",
  "browser.interact",
  "knowledge.search",
  "web.search"
]

[[tools]]
id = "google-workspace"
domains = ["calendar"]
capabilities = [
  "calendar.read",
  "calendar.search",
  "calendar.free_busy",
  "calendar.write"
]
auth = "provider-native"
status = "runtime"
command = "gws.ps1"

[[tools]]
id = "calendar-runtime"
domains = ["calendar"]
capabilities = [
  "calendar.read",
  "calendar.search",
  "calendar.free_busy",
  "calendar.write"
]
auth = "provider-native"
status = "runtime"
command = "python scripts/calendar_mcp_server.py"

[[tools]]
id = "himalaya"
domains = ["mail"]
capabilities = [
  "mail.read",
  "mail.search"
]
auth = "local-provider-auth"
status = "backend"
command = "himalaya"
account = "ovgu"
read_only = true

[[tools]]
id = "mail-runtime"
domains = ["mail"]
capabilities = [
  "mail.read",
  "mail.search"
]
auth = "provider-native"
status = "runtime"
command = "python scripts/mail_mcp_server.py"
read_only = true

[[tools]]
id = "personal-os-scheduler"
domains = ["reminder"]
capabilities = ["reminder.create", "reminder.update", "reminder.cancel"]
status = "service"

[[tools]]
id = "content-poller"
domains = ["content"]
capabilities = ["content.watch"]
status = "runtime"
command = "python3 scripts/poll_content_updates.py"
read_only = true

[[tools]]
id = "browser-use"
domains = ["fallback"]
capabilities = ["browser.interact"]
status = "external"

[[tools]]
id = "qmd"
domains = ["knowledge"]
capabilities = ["knowledge.search"]
status = "external"
command = "qmd mcp"
read_only = true

[[tools]]
id = "searxng"
domains = ["web"]
capabilities = ["web.search"]
status = "external"
provider = "searxng"
read_only = true

[[accounts]]
id = "personal"
domain = "mail"
tool = "mail-runtime"
provider = "google-workspace"

[[accounts]]
id = "student"
domain = "mail"
tool = "mail-runtime"
provider = "himalaya"
provider_account = "ovgu"

[[accounts]]
id = "google-calendar"
domain = "calendar"
tool = "calendar-runtime"
provider = "google-workspace"
